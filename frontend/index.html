<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Manajemen Karyawan</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-semibold text-white">ManagerWeb</h1>
      <p class="text-slate-400 text-sm mt-1">Masuk ke panel manajemen karyawan</p>
    </div>

    <form id="loginForm" class="bg-white rounded-xl shadow-lg p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-800"
          placeholder="admin@perusahaan.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-800"
          placeholder="••••••••">
      </div>

      <p id="errorMsg" class="text-red-500 text-sm hidden"></p>

      <button type="submit" id="loginBtn"
        class="w-full bg-slate-900 text-white py-2.5 rounded-lg font-medium hover:bg-slate-800 transition">
        Login
      </button>
    </form>

    <p class="text-center text-slate-500 text-xs mt-4">
      Belum punya akun? Hubungi admin untuk dibuatkan akses.
    </p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
