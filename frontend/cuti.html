<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuti - Manajemen Karyawan</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-slate-100 min-h-screen">

  <div class="flex min-h-screen">

    <aside id="sidebar" class="fixed md:static z-20 -translate-x-full md:translate-x-0 transition-transform duration-200 w-64 bg-slate-900 text-slate-200 min-h-screen flex flex-col">
      <div class="px-6 py-5 border-b border-slate-700">
        <h1 class="text-lg font-semibold text-white">ManagerWeb</h1>
        <p class="text-xs text-slate-400" id="userEmail">memuat...</p>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 transition">
          <span>📊</span> Dashboard
        </a>
        <a href="karyawan.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 transition">
          <span>👥</span> Karyawan
        </a>
        <a href="absensi.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 transition">
          <span>🕒</span> Absensi
        </a>
        <a href="cuti.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-slate-800 text-white font-medium">
          <span>📄</span> Cuti
        </a>
      </nav>
      <div class="px-3 py-4 border-t border-slate-700">
        <button id="logoutBtn" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-red-300 transition">
          <span>🚪</span> Logout
        </button>
      </div>
    </aside>

    <div id="overlay" class="fixed inset-0 bg-black/40 z-10 hidden md:hidden"></div>

    <main class="flex-1 p-5 md:p-8">
      <button id="menuBtn" class="md:hidden mb-3 text-slate-600">☰ Menu</button>

      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <h2 class="text-2xl font-semibold text-slate-800">Pengajuan Cuti</h2>
          <p class="text-slate-500 text-sm">Kelola pengajuan cuti karyawan</p>
        </div>
        <button id="btnAjukan" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition">
          + Ajukan Cuti
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-slate-500 border-b border-slate-100">
              <th class="px-5 py-3 font-medium">Nama</th>
              <th class="px-5 py-3 font-medium">Tanggal Mulai</th>
              <th class="px-5 py-3 font-medium">Tanggal Selesai</th>
              <th class="px-5 py-3 font-medium">Alasan</th>
              <th class="px-5 py-3 font-medium">Status</th>
              <th class="px-5 py-3 font-medium text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelCuti">
            <tr><td class="px-5 py-4 text-slate-400" colspan="6">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal ajukan cuti -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-30 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
      <h3 class="text-lg font-semibold text-slate-800 mb-4">Ajukan Cuti</h3>
      <form id="cutiForm" class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Karyawan</label>
          <select id="pilihKaryawan" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="">Memuat data...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Mulai</label>
          <input type="date" id="tanggalMulai" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Selesai</label>
          <input type="date" id="tanggalSelesai" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Alasan</label>
          <textarea id="alasan" required rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" id="btnBatal" class="flex-1 border border-slate-300 text-slate-700 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 transition">Batal</button>
          <button type="submit" class="flex-1 bg-slate-900 text-white py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition">Ajukan</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/cuti.js"></script>
</body>
</html>
